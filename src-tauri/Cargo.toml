[package]
name = "satellite-setup"
version = "0.1.0"
description = "Sets up Satellite on an Orbit Speak or Orbit Player from a computer"
authors = ["Elijah Massey"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "satellite_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ssip-client-async = "0.19"
# The same GIO as Tauri's GTK uses, for Orca's D-Bus service.
gio = "0.18"
