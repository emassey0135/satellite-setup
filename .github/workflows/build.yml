# Builds Satellite Setup for macOS (one app for Apple silicon and Intel), Windows (the program itself, for x64 and
# ARM64) and Linux (the program itself, for x86_64 and ARM) on every push and pull request. Pushes to main are
# published as the "dev" pre-release, and a tag such as v1.2.3, which must match the version in
# src-tauri/tauri.conf.json, as a release. The builds aren't signed yet, so macOS and Windows warn the first time one
# is opened.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            target: universal-apple-darwin
            bundles: dmg
            asset: satellite-setup-macos.dmg
          # Windows and Linux get the program itself, which runs as it is: there's nothing to install. On Linux it
          # uses the system's own WebKitGTK; an AppImage's older bundled copy, with its accessibility libraries, left
          # Orca unable to read the window as a web page. Built on Ubuntu 22.04, it runs on distributions at least
          # that recent.
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: satellite-setup-windows-x64.exe
          # Native, as Windows 10 on ARM can't run x64 programs.
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: satellite-setup-windows-arm64.exe
          # Linux stays on Ubuntu 22.04 on purpose: a program needs at least the glibc of the system it was built on,
          # and 22.04's (2.35) lets it run on Ubuntu 22.04, Debian 12 and the like. Moving to a newer Ubuntu would
          # drop them; move only when GitHub retires this image, and change the README's list then.
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: satellite-setup-linux-x86_64
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: satellite-setup-linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Rust
        shell: bash
        run: |
          rustup update stable
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add ${{ matrix.target }}
          fi

      # Keeps the compiled libraries between runs, so that only Satellite Setup's own code is built again.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Linux libraries
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - name: Version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.bundles }}" ]; then
            npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          else
            npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --no-bundle
          fi

      # Under a name without the version, so that the latest release's link to each stays the same.
      - name: Collect
        shell: bash
        run: |
          mkdir out
          release=src-tauri/target/${{ matrix.target }}/release
          case "${{ matrix.asset }}" in
            *.dmg) built=$(find $release/bundle -name '*.dmg' | head -1) ;;
            *.exe) built=$release/satellite-setup.exe ;;
            *) built=$release/satellite-setup ;;
          esac
          cp "$built" "out/${{ matrix.asset }}"
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/*

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Publish the dev build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev out/* --prerelease --target "$GITHUB_SHA" --title "Development build" \
            --notes "Built from $GITHUB_SHA. Development builds aren't tested on the devices yet."

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --generate-notes
